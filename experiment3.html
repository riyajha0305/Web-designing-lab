
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My To-Do List</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Arial, sans-serif;
    background: #eee7fa;
    color: #302447;
    min-height: 100vh;
}

header {
    background: #302447;
    color: white;
    padding: 20px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

main {
    max-width: 650px;
    margin: 65px auto;
    padding: 20px;
}

h1 {
    text-align: center;
    font-size: 34px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #756887;
    margin-bottom: 30px;
}

.todo-box {
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 5px 20px #30244715;
}

.input-area {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 13px;
    border: 1px solid #d7cce6;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

button {
    border: none;
    background: #76539a;
    color: white;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #51366f;
}

ul {
    list-style: none;
    margin-top: 25px;
}

li {
    background: #f5f1fa;
    padding: 13px;
    margin-bottom: 10px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

li span {
    cursor: pointer;
    flex: 1;
    overflow-wrap: anywhere;
}

li.completed span {
    text-decoration: line-through;
    color: #958ba1;
}

.delete {
    background: #b45e78;
    padding: 7px 12px;
}

#message {
    text-align: center;
    color: #958ba1;
    margin-top: 20px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #756887;
}

@media(max-width: 600px) {
    header { flex-direction: column; gap: 12px; }
    nav a { margin: 0 7px; }
    .input-area { flex-direction: column; }
}
</style>
</head>

<body>

<header>
    <h2>Daily Tasks</h2>
    <nav>
        <a href="#home">Home</a>
        <a href="#tasks">My Tasks</a>
    </nav>
</header>

<main id="home">
    <h1>My To-Do List</h1>
    <p class="subtitle">Plan your day, one task at a time.</p>

    <div class="todo-box" id="tasks">
        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Enter a new task...">
            <button onclick="addTask()">Add Task</button>
        </div>

        <ul id="taskList"></ul>
        <p id="message">No tasks added yet. Start by adding one!</p>
    </div>
</main>

<footer>
    <p>© 2026 Daily Tasks | Web Designing Lab</p>
</footer>

<script>
function addTask() {
    let input = document.getElementById("taskInput");
    let task = input.value.trim();

    if (task === "") {
        alert("Please enter a task!");
        return;
    }

    let li = document.createElement("li");

    let span = document.createElement("span");
    span.textContent = task;

    span.onclick = function() {
        li.classList.toggle("completed");
    };

    let deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete";
    deleteButton.className = "delete";

    deleteButton.onclick = function() {
        li.remove();
        updateMessage();
    };

    li.appendChild(span);
    li.appendChild(deleteButton);

    document.getElementById("taskList").appendChild(li);

    input.value = "";
    updateMessage();
}

function updateMessage() {
    let list = document.getElementById("taskList");
    let message = document.getElementById("message");

    if (list.children.length === 0) {
        message.textContent = "No tasks added yet. Start by adding one!";
    } else {
        message.textContent = list.children.length + " task(s) in your list.";
    }
}

document.getElementById("taskInput").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        addTask();
    }
});
</script>

</body>
</html>
